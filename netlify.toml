[build]
  command = "npm run build"
  publish = "dist"

# Disable Netlify Pretty URLs post-processing. It was rewriting in-page links
# from /about.html to /about and serving clean URLs with 200, which created
# duplicate URLs and shadowed the clean -> .html 301 rules below.
# This overrides Project configuration > Developer settings > Post processing > Pretty URLs.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Directory index roots: continue serving index.html (unchanged behaviour)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200
[[redirects]]
  from = "/ja"
  to = "/ja/index.html"
  status = 200
[[redirects]]
  from = "/ko"
  to = "/ko/index.html"
  status = 200
[[redirects]]
  from = "/blog/ja"
  to = "/blog/ja/index.html"
  status = 200
[[redirects]]
  from = "/blog/ko"
  to = "/blog/ko/index.html"
  status = 200
# Leaf pages: 301 clean URL -> .html (the declared canonical). force=true overrides Netlify pretty-URLs rewrite.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true
